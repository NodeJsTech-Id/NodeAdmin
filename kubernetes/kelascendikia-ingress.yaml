apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kelascendikia-ingress
  namespace: kelascendikia
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers: "on"

spec:
  tls:
    - hosts:
      - kelascendikia.id
      secretName: kelascendikia-id-tls
    - hosts:
      - kelascendikia.com
      secretName: kelascendikia-com-tls
  rules:
  - host: kelascendikia.id
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kelascendikia-service
            port:
              number: 80
  - host: kelascendikia.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kelascendikia-service
            port:
              number: 80
