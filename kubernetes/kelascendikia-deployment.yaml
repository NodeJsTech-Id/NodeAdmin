apiVersion: apps/v1
kind: Deployment
metadata:
  name: KelasCendikia
  namespace: KelasCendikia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: KelasCendikia
  template:
    metadata:
      labels:
        app: KelasCendikia
    spec:
      containers:
      - name: KelasCendikia
        image: docker.io/flazhost/kelascendikia:latest
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: database_url
      imagePullSecrets:
      - name: authdockerhub