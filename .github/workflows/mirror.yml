name: Mirror to clean repo

# Sinkronkan snapshot BERSIH (tanpa materi porting/spec bahasa lain) dari repo
# maintain (NodeJsTech-Id/NodeAdmin) ke repo rilis publik (FlazHost-Com/NodeAdmin).
# Repo bersih = sumber tunggal giget create-app + publish npm.
#
# Prasyarat: secret MIRROR_TOKEN = PAT (fine-grained, Contents: write ke
# FlazHost-Com/NodeAdmin) di Settings → Secrets repo ini.
#
# Flow otomatis (push ke main sudah cukup untuk publish npm):
#   push main → CI (harus lolos) → mirror ke FlazHost-Com
#              → cek versi paket vs npm → push tag versi baru
#              → release.yml di FlazHost-Com → changeset publish → npmjs
#
# Cara publish: bump versi di packages/*/package.json, push ke main — selesai.
# Tag tidak perlu di-push manual.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'template-v*'
      - '@flazhost-nodeadmin/*'
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Untuk trigger workflow_run: hanya lanjut jika CI sukses.
    # Untuk push tag / dispatch: event bukan workflow_run → selalu lanjut.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout maintain (SHA yang lolos CI / tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pada workflow_run, checkout commit yang DIUJI CI (bukan default branch).
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Regenerate template agar snapshot selalu sinkron dgn src/ terbaru.
      - name: Rebuild template
        run: node tools/buildTemplate.js

      - name: Build clean snapshot
        run: node tools/buildCleanMirror.js "$RUNNER_TEMP/clean"

      - name: Sync snapshot to clean repo (incremental)
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -e
          DEST="FlazHost-Com/NodeAdmin"
          REMOTE="https://x-access-token:${MIRROR_TOKEN}@github.com/${DEST}.git"

          # Clone repo bersih (shallow) agar commit incremental — hanya diff yang
          # di-push, bukan 163MB penuh tiap run (penyebab push gagal sebelumnya).
          git clone --depth 1 "$REMOTE" "$RUNNER_TEMP/dest"
          cd "$RUNNER_TEMP/dest"
          git config user.name "nodeadmin-mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"

          # Ganti seluruh isi kerja dengan snapshot bersih (kecuali .git).
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/clean/." .

          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan untuk di-mirror."
          else
            git commit -q -m "mirror: snapshot dari NodeJsTech-Id@${GITHUB_SHA::7}"
            git push origin HEAD:main
          fi

      # Teruskan tag ke repo bersih:
      #  - template-v* → dibutuhkan giget create-app.
      #  - @flazhost-nodeadmin/*@* → memicu release.yml (publish npm) di repo bersih.
      - name: Forward tag to clean repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          DEST="FlazHost-Com/NodeAdmin"
          cd "$RUNNER_TEMP/dest"
          git tag -f "$TAG"
          git push -f "https://x-access-token:${MIRROR_TOKEN}@github.com/${DEST}.git" "refs/tags/${TAG}"

      # Auto-publish: cek tiap paket vs versi yang sudah ada di npm.
      # Bila ditemukan versi baru, push tag versi → memicu release.yml di repo bersih.
      # Step ini hanya jalan saat push ke main (bukan saat trigger dari tag push,
      # karena tag push sudah ditangani "Forward tag" di atas).
      - name: Auto-publish paket baru ke npm
        if: github.event_name != 'push'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -e
          DEST="FlazHost-Com/NodeAdmin"
          REMOTE="https://x-access-token:${MIRROR_TOKEN}@github.com/${DEST}.git"

          for PKG_JSON in packages/core/package.json packages/cli/package.json packages/create-app/package.json; do
            NAME=$(node -p "require('./${PKG_JSON}').name")
            VERSION=$(node -p "require('./${PKG_JSON}').version")
            TAG="${NAME}@${VERSION}"

            PUBLISHED=$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)
            if [ -z "$PUBLISHED" ]; then
              echo "Versi baru: ${TAG} — push tag ke ${DEST}"
              git -C "$RUNNER_TEMP/dest" tag -f "${TAG}"
              git -C "$RUNNER_TEMP/dest" push -f "${REMOTE}" "refs/tags/${TAG}"
            else
              echo "${TAG} sudah di npm, skip."
            fi
          done
