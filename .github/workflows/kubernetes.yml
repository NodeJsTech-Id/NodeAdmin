name: Deploy to Kubernetes

on:
  push:
    branches: [kelascendikia-kubernetes]

# env:
#   KELASCENDIKIA_DATABASE_URL: ${{ secrets.KELASCENDIKIA_DATABASE_URL }}
#   PERCOBAAN: "Ini Adalah Percobaan"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    # - name: Debug path resolution
    #   run: |
    #     echo "Resolving paths:"
    #     echo $(pwd)
    #     echo $(ls ./src/config)
    #     echo $(ls ./node_modules/typeorm)
    #     echo $(node -e "console.log(require('path').resolve('./src/config/ormconfig.ts'))")
            
    # - name: Debug Environment Variables
    #   # env:
    #     # KELASCENDIKIA_DATABASE_URL: ${{ secrets.KELASCENDIKIA_DATABASE_URL }}
    #   run: |
    #     echo "Database URL starts with: ${KELASCENDIKIA_DATABASE_URL:0:30}..."


    # - name: Run Application
    #   # env:
    #   #   PERCOBAAN: "Ini Adalah Percobaan"
    #   run: |
    #     node -e 'console.log(process.env.PERCOBAAN);'

    - name: Print environment variables
      run: printenv

    - name: Migrating Database
      working-directory: ${{ github.workspace }}
      env:
        KELASCENDIKIA_DATABASE_URL: ${{ secrets.KELASCENDIKIA_DATABASE_URL }}
      run: sudo npx ts-node ./node_modules/typeorm/cli.js migration:run -d ./src/config/ormconfig.ts

        
      # run: npm run migration:run

    # - name: Run TypeORM migrations
    #   env:
    #     KELASCENDIKIA_DATABASE_URL: ${{ secrets.KELASCENDIKIA_DATABASE_URL }}
    #   run: |
    #     ABSOLUTE_PATH=$(node -e "console.log(require('path').resolve('./src/config/ormconfig.ts'))")
    #     npx ts-node ./node_modules/typeorm/cli.js migration:run -d $ABSOLUTE_PATH

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (tags) for Docker
      id: meta
      run: |
        echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
        if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV
        elif [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
          echo "IMAGE_TAG=dev" >> $GITHUB_ENV
        else
          echo "IMAGE_TAG=${BRANCH_NAME}" >> $GITHUB_ENV
        fi
        # Pastikan IMAGE_TAG memiliki nilai default jika kosong
        if [ -z "${IMAGE_TAG}" ]; then
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV
        fi

    - name: Build and push Docker image
      run: |
        docker buildx build --push \
          --tag flazhost/kelascendikia:${{ env.IMAGE_TAG }} \
          --tag flazhost/kelascendikia:${{ env.BRANCH_NAME }}-${{ env.GIT_SHA }} \
          .

    - name: Set up kubectl
      uses: azure/setup-kubectl@v1
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

    - name: Create Namespace
      run: |
        kubectl get namespace kelascendikia || kubectl create namespace kelascendikia || true

    - name: Create Registry Secret
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        DOCKER_EMAIL: ${{ secrets.DOCKER_EMAIL }}    
      run: |
        kubectl create secret docker-registry authdockerhub \
          --docker-server=https://index.docker.io/v1/ \
          --docker-username=${DOCKER_USERNAME} \
          --docker-password=${DOCKER_PASSWORD} \
          --docker-email=${DOCKER_EMAIL} \
          -n kelascendikia --dry-run=client -o yaml | kubectl apply -f -

    - name: Create App Secret
      env:
        KELASCENDIKIA_DATABASE_URL: ${{ secrets.KELASCENDIKIA_DATABASE_URL }}
        KELASCENDIKIA_REDIS_URL: ${{ secrets.KELASCENDIKIA_REDIS_URL }}
        KELASCENDIKIA_OSS_ACCESS_ID: ${{ secrets.KELASCENDIKIA_OSS_ACCESS_ID }}
        KELASCENDIKIA_OSS_ACCESS_KEY: ${{ secrets.KELASCENDIKIA_OSS_ACCESS_KEY }}
        KELASCENDIKIA_OSS_REGION: ${{ secrets.KELASCENDIKIA_OSS_REGION }}
        KELASCENDIKIA_OSS_BUCKET: ${{ secrets.KELASCENDIKIA_OSS_BUCKET }}
        KELASCENDIKIA_SESSION_SECRET: ${{ secrets.KELASCENDIKIA_SESSION_SECRET }}
        KELASCENDIKIA_JWT_SECRET: ${{ secrets.KELASCENDIKIA_JWT_SECRET }}
        KELASCENDIKIA_ZOOM_MEETING_SDK_KEY: ${{ secrets.KELASCENDIKIA_ZOOM_MEETING_SDK_KEY }}
        KELASCENDIKIA_ZOOM_MEETING_SDK_SECRET: ${{ secrets.KELASCENDIKIA_ZOOM_MEETING_SDK_SECRET }}
        KELASCENDIKIA_ZOOM_API_BASE_URL: ${{ secrets.KELASCENDIKIA_ZOOM_API_BASE_URL }}
        KELASCENDIKIA_ZOOM_OAUTH_ENDPOINT: ${{ secrets.KELASCENDIKIA_ZOOM_OAUTH_ENDPOINT }}
        KELASCENDIKIA_ZOOM_ACCOUNT_ID: ${{ secrets.KELASCENDIKIA_ZOOM_ACCOUNT_ID }}
        KELASCENDIKIA_ZOOM_CLIENT_ID: ${{ secrets.KELASCENDIKIA_ZOOM_CLIENT_ID }}
        KELASCENDIKIA_ZOOM_CLIENT_SECRET: ${{ secrets.KELASCENDIKIA_ZOOM_CLIENT_SECRET }}
      run: |
        kubectl create secret generic app-secrets \
          --from-literal=kelascendikia_database_url=${KELASCENDIKIA_DATABASE_URL} \
          --from-literal=kelascendikia_redis_url=${KELASCENDIKIA_REDIS_URL} \
          --from-literal=kelascendikia_oss_access_id=${KELASCENDIKIA_OSS_ACCESS_ID} \
          --from-literal=kelascendikia_oss_access_key=${KELASCENDIKIA_OSS_ACCESS_KEY} \
          --from-literal=kelascendikia_oss_region=${KELASCENDIKIA_OSS_REGION} \
          --from-literal=kelascendikia_oss_bucket=${KELASCENDIKIA_OSS_BUCKET} \
          --from-literal=kelascendikia_session_secret=${KELASCENDIKIA_SESSION_SECRET} \
          --from-literal=kelascendikia_jwt_secret=${KELASCENDIKIA_JWT_SECRET} \
          --from-literal=kelascendikia_zoom_meeting_sdk_key=${KELASCENDIKIA_ZOOM_MEETING_SDK_KEY} \
          --from-literal=kelascendikia_zoom_meeting_sdk_secret=${KELASCENDIKIA_ZOOM_MEETING_SDK_SECRET} \
          --from-literal=kelascendikia_zoom_api_base_url=${KELASCENDIKIA_ZOOM_API_BASE_URL} \
          --from-literal=kelascendikia_zoom_oauth_endpoint=${KELASCENDIKIA_ZOOM_OAUTH_ENDPOINT} \
          --from-literal=kelascendikia_zoom_account_id=${KELASCENDIKIA_ZOOM_ACCOUNT_ID} \
          --from-literal=kelascendikia_zoom_client_id=${KELASCENDIKIA_ZOOM_CLIENT_ID} \
          --from-literal=kelascendikia_zoom_client_secret=${KELASCENDIKIA_ZOOM_CLIENT_SECRET} \
          -n kelascendikia --dry-run=client -o yaml | kubectl apply -f -

    # - name: Debug Environment Variables
    #   env:
    #     KELASCENDIKIA_DATABASE_URL: ${{ secrets.KELASCENDIKIA_DATABASE_URL }}
    #   run: |
    #     echo "Database URL starts with: ${KELASCENDIKIA_DATABASE_URL:0:20}..."

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f kubernetes/kelascendikia-deployment.yaml
        kubectl apply -f kubernetes/kelascendikia-service.yaml