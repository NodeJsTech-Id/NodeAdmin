name: Deploy to Kubernetes

on:
  push:
    branches: [kelascendikia-kubernetes]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Migrating Database
      run: npm run migration:run

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (tags) for Docker
      id: meta
      run: |
        echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
        if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV
        elif [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
          echo "IMAGE_TAG=dev" >> $GITHUB_ENV
        else
          echo "IMAGE_TAG=${BRANCH_NAME}" >> $GITHUB_ENV
        fi
        # Pastikan IMAGE_TAG memiliki nilai default jika kosong
        if [ -z "${IMAGE_TAG}" ]; then
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV
        fi

    - name: Build and push Docker image
      run: |
        docker buildx build --push \
          --tag flazhost/kelascendikia:${{ env.IMAGE_TAG }} \
          --tag flazhost/kelascendikia:${{ env.BRANCH_NAME }}-${{ env.GIT_SHA }} \
          .

    - name: Set up kubectl
      uses: azure/setup-kubectl@v1
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

    - name: Create Namespace Kubenode
      run: |
        kubectl create namespace KelasCendikia || true

    - name: Create Registry Secret
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        DOCKER_EMAIL: ${{ secrets.DOCKER_EMAIL }}    
      run: |
        kubectl create secret docker-registry authdockerhub \
          --docker-server=https://index.docker.io/v1/ \
          --docker-username=${DOCKER_USERNAME} \
          --docker-password=${DOCKER_PASSWORD} \
          --docker-email=${DOCKER_EMAIL} \
          -n KelasCendikia --dry-run=client -o yaml | kubectl apply -f -

    - name: Create App Secret
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        kubectl create namespace KelasCendikia || true
        kubectl create secret generic app-secrets \
          --from-literal=database_url=${DATABASE_URL} \
          -n KelasCendikia --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f kubernetes/kelascendikia-deployment.yaml
        kubectl apply -f kubernetes/kelascendikia-service.yaml