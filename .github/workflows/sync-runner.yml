name: Sync starter → flazhost-runner

on:
  push:
    tags: ['template-v*']
  workflow_dispatch:

concurrency:
  group: sync-runner
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Hanya berjalan di repo bersih FlazHost-Com/NodeAdmin.
    # File ini ikut ter-mirror tapi TIDAK boleh jalan di repo lain.
    if: github.repository == 'FlazHost-Com/NodeAdmin'
    steps:
      - name: Checkout FlazHost-Com/NodeAdmin
        uses: actions/checkout@v4

      - name: Clone flazhost-runner/nodeadmin
        env:
          TOKEN: ${{ secrets.RUNNER_SYNC_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${TOKEN}@github.com/flazhost-runner/nodeadmin.git" \
            _runner
          cd _runner
          git config user.name  flazhost-bot
          git config user.email bot@flazhost.com

      - name: Sync kode app (preserve deployment files di flazhost-runner)
        run: |
          set -euo pipefail
          # Sync template/ (kode app) ke clone flazhost-runner.
          # File deployment milik flazhost-runner (Dockerfile, entrypoint, .github/, dll)
          # TIDAK disentuh — rsync hanya update apa yang ada di template/.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='Dockerfile' \
            --exclude='docker-entrypoint.sh' \
            --exclude='.dockerignore' \
            --exclude='.github/' \
            template/ _runner/
          echo "Diff:"
          git -C _runner diff --stat || true

      - name: Commit & push bila ada perubahan
        env:
          TOKEN: ${{ secrets.RUNNER_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          cd _runner
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan kode app di flazhost-runner."
          else
            git commit -m "sync: ${GITHUB_REF_NAME:-manual} from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            git push origin main
          fi
